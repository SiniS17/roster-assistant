<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roster Assistant</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')==='dark'?'dark':'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
<style>
:root{
  --z:1; --cw:calc(64px*var(--z)); --rh:calc(40px*var(--z)); --nw:250px;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  /* light theme (default) */
  color-scheme:light;
  --bg:#f4f6f9; --panel:#fff; --panel2:#eef1f5; --line:#dde3ea; --line2:#c9d1db; --text:#18202a; --muted:#5f6b7a;
  --green:#0e9f68; --amber:#e0911a; --red:#d94542; --blue:#2f6fe0;
  --grid:#e1e6ed; --stats-bg:#f9fafc; --we:rgba(0,0,0,.035); --we-small:#c2504e; --hover:rgba(0,0,0,.04); --hover-name:#eaeff4;
  --idx:#9aa5b1; --av-bg:#e6ebf1; --av-line:#cdd5de; --kn:#6b7787; --nred:#c62828; --amber-ink:#9a5b00; --ol:28%;
  --ghost:#6b7787; --ghost-line:#a3adb9; --note-bg:#e8f6ef; --note-fg:#0b6b45; --warn-bg:#fff6e5; --warn-fg:#8a5a00;
  --err-text:#c62828; --btn-hover:#e3e8ee; --log-bg:#f1f4f8;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#07090b; --panel:#0d1115; --panel2:#131920; --line:#1e262e; --line2:#2b3641; --text:#e7ebf0; --muted:#7f8a98;
  --green:#19c37d; --amber:#f0a73a; --red:#ef5350; --blue:#4c8dff;
  --grid:#11161b; --stats-bg:#0a0d10; --we:rgba(255,255,255,.025); --we-small:#c97b7b; --hover:rgba(255,255,255,.035); --hover-name:#10151a;
  --idx:#4b5561; --av-bg:#1a222a; --av-line:#28323c; --kn:#6c7683; --nred:#ff7b78; --amber-ink:#f0a73a; --ol:70%;
  --ghost:#8a94a2; --ghost-line:#4b5561; --note-bg:#0c1410; --note-fg:#8fd9b6; --warn-bg:#17120a; --warn-fg:#e9c27d;
  --err-text:#ff9a98; --btn-hover:#18212a; --log-bg:#080b0e;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column;overflow:hidden;font-size:13px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;background:transparent;border:1px solid var(--line);border-radius:8px}
.icon-btn:hover{background:var(--panel2)}
.brand{font-weight:700;letter-spacing:.02em;line-height:1.1}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.04em}
.tabs{display:flex;gap:6px;margin-left:10px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tab{white-space:nowrap;padding:7px 14px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted)}
.tab:hover{color:var(--text)}
.tab.on{background:var(--panel2);border-color:var(--line2);color:var(--text)}
.spacer{flex:1}
.month{padding:7px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);white-space:nowrap}
.zoom{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.zoom button{width:30px;height:32px;background:none;border:0;font-size:16px}
.zoom span{min-width:46px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}
.search{width:200px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.search::placeholder{color:var(--muted)}
select.search{width:auto;max-width:210px;appearance:auto}
td.day.span{max-width:none;background-image:none}
td.day.span .chip{padding:0 10px}

/* stats */
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--stats-bg);color:var(--muted)}
.stats b{color:var(--text);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.legend{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px}
.lg{padding:2px 9px;border-radius:5px;border:1px solid;font-size:11px}

/* grid */
.wrap{flex:1;overflow:auto;position:relative}
table{border-collapse:separate;border-spacing:0;font-size:calc(12px*var(--z))}
th,td{padding:0;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid)}
thead th{position:sticky;top:0;z-index:3;background:var(--panel);height:calc(46px*var(--z));min-width:var(--cw);max-width:var(--cw);text-align:center;font-weight:600}
thead th small{display:block;font-size:.8em;color:var(--muted);font-weight:600;letter-spacing:.04em}
thead th.we,td.we{background-image:linear-gradient(var(--we),var(--we))}
thead th.we small{color:var(--we-small)}
thead th.today{box-shadow:inset 0 -2px var(--green)} thead th.today small{color:var(--green)}
td.day{height:var(--rh);min-width:var(--cw);max-width:var(--cw);text-align:center;padding:3px}
td.day.today{background-color:rgba(25,195,125,.06)}
.name{position:sticky;left:0;z-index:2;background:var(--bg);min-width:var(--nw);max-width:var(--nw);padding:0 12px;text-align:left}
thead th.name{z-index:4;background:var(--panel);text-align:left;color:var(--muted);font-weight:600}
tbody tr:hover td{background-color:var(--hover)}
tbody tr:hover td.name{background-color:var(--hover-name)}
.who{display:flex;align-items:center;gap:10px;height:var(--rh)}
.idx{width:16px;color:var(--idx);text-align:right;font-variant-numeric:tabular-nums}
.av{width:28px;height:28px;border-radius:50%;background:var(--av-bg);border:1px solid var(--av-line);display:grid;place-items:center;font-weight:700;flex:none}
.who b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.who small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.who small i{color:var(--green);font-style:normal}

.chip{display:block;height:100%;min-height:calc(28px*var(--z));line-height:calc(28px*var(--z));border-radius:6px;border:1px solid;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.k-n{color:var(--kn);border-color:transparent;font-weight:500}
.k-nred{color:var(--nred);background:rgba(239,83,80,.12);border-color:rgba(239,83,80,.35)}
.k-h{color:var(--amber-ink);background:rgba(240,167,58,.12);border-color:rgba(240,167,58,.4)}
.k-o{color:hsl(var(--h) 80% var(--ol));background:hsl(var(--h) 60% 50%/.14);border-color:hsl(var(--h) 60% 55%/.4)}
.chg{animation:flick 2.2s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(25,195,125,0)}50%{opacity:.55;box-shadow:0 0 9px 1px rgba(25,195,125,.5)}}
.ghost{color:var(--ghost);background:transparent;border:1px dashed var(--ghost-line);text-decoration:line-through;font-weight:500}
.badge{display:inline-block;margin-left:7px;padding:0 7px;border-radius:999px;background:var(--amber);color:#1a1203;font-size:11px;font-weight:700;line-height:17px}
.note{padding:7px 16px;border-bottom:1px solid var(--line);background:var(--note-bg);color:var(--note-fg);display:flex;gap:12px;align-items:center}
.note[hidden]{display:none}
.note.warn{background:var(--warn-bg);color:var(--warn-fg)}
.note button{padding:3px 12px;border-radius:6px;border:1px solid currentColor;background:none;color:inherit}
.upd{animation:pulse 1.6s ease-out 3}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(25,195,125,.9)}100%{box-shadow:0 0 0 9px rgba(25,195,125,0)}}
@media (prefers-reduced-motion:reduce){.upd{animation:none;outline:2px solid var(--green)}.chg{animation:none;outline:2px dashed var(--green)}}

.msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:var(--muted)}
.msg div{max-width:520px}
.msg code{display:block;margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--err-text);text-align:left;white-space:pre-wrap;word-break:break-word}
.btn{padding:8px 16px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2)}
.btn:hover{background:var(--btn-hover)}
.btn.primary{background:#1565d8;border-color:#1565d8;color:#fff;font-weight:600}
.btn.primary:hover{background:#1a73f0}
.btn[disabled]{opacity:.55;cursor:wait}

/* side menu */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:280px;background:var(--panel);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .22s ease;z-index:21;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:9px;background:var(--green);display:grid;place-items:center;color:#04140c;font-weight:800}
.nav{padding:10px;display:flex;flex-direction:column;gap:2px}
.nav a,.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:8px;border:0;background:none;color:var(--text);text-decoration:none}
.nav a:hover,.nav button:hover{background:var(--panel2)}
.nav .on{background:var(--panel2);box-shadow:inset 3px 0 var(--green)}
.nav hr{border:0;border-top:1px solid var(--line);margin:8px 4px}

/* KHDT dialog */
dialog{padding:0;border:1px solid var(--line2);border-radius:14px;background:var(--panel);color:var(--text);width:min(640px,94vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.65)}
.dlg{padding:22px 24px}
.dlg h2{margin:0 0 6px;font-size:20px}
.dlg p{margin:0 0 16px;color:var(--muted);line-height:1.5}
.dlg label{display:block;margin:14px 0 6px;font-weight:600}
.dlg input[type=file],.dlg input[type=text]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.dlg .row{display:flex;gap:10px;margin-top:18px;align-items:center}
.dlg .chk{display:flex;gap:8px;align-items:center;margin-top:14px;font-weight:400}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.pill{padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel2)}
.pill b{font-variant-numeric:tabular-nums}
.log{max-height:240px;overflow:auto;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--log-bg);font:12px/1.55 Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.err{margin-top:14px;padding:10px 12px;border:1px solid rgba(239,83,80,.4);border-radius:8px;background:rgba(239,83,80,.1);color:var(--err-text);white-space:pre-wrap;word-break:break-word}

/* Daily Distribution view */
body[data-view="dist"] .zoom, body[data-view="dist"] #team, body[data-view="dist"] #q, body[data-view="dist"] #month, body[data-view="dist"] #note{display:none!important}
.daystrip{display:flex;gap:6px;overflow-x:auto;width:100%;scrollbar-width:thin;padding:1px 0}
.dbtn{flex:none;min-width:62px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--muted);text-align:center;line-height:1.25}
.dbtn small{display:block;font-size:10px;letter-spacing:.08em;font-weight:600}
.dbtn b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.dbtn:hover{border-color:var(--line2)}
.dbtn.on{border-color:var(--green);box-shadow:inset 0 -2px var(--green);background:var(--panel)}
.dbtn.today small{color:var(--green)}
.dist{max-width:1320px;margin:0 auto;padding:22px 20px 44px}
.dist-head{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:flex-start;margin-bottom:22px}
.dist-date{margin:0;font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.01em}
.dist-meta{margin-top:8px;color:var(--muted);font-size:12px;letter-spacing:.05em}
.dist-meta b{color:var(--text);font:600 12px Consolas,monospace}
.dist-meta i{font-style:normal;margin:0 9px;opacity:.5}
.crew{display:grid;grid-template-columns:repeat(4,minmax(128px,1fr));border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.crew>div{padding:9px 14px;border-left:1px solid var(--line);min-width:0}
.crew>div:first-child{border-left:0}
.crew small{display:block;color:var(--muted);font-size:10px;letter-spacing:.08em;font-weight:600;white-space:nowrap}
.crew b{display:block;margin-top:4px;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crew span{display:block;margin-top:2px;color:var(--muted);font:11px Consolas,monospace}
.dist-cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
.dist-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.dcard{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.dcard>header{display:flex;align-items:center;gap:8px;padding:9px 14px;font-weight:700;font-size:12px;letter-spacing:.06em;border-bottom:1px solid var(--line)}
.dcard.zone>header{background:rgba(25,195,125,.10);color:var(--green)}
.dcard.shift>header{background:rgba(240,167,58,.12);color:var(--amber)}
.dcard.shop>header{background:var(--panel2);color:var(--text)}
.dcard .tag{margin-left:auto;padding:2px 8px;border:1px solid var(--line2);border-radius:5px;color:var(--muted);font-size:10px;letter-spacing:.06em}
.dcard .empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:12px}
.dcard .empty svg{display:block;margin:0 auto 8px;opacity:.5}
.tscroll{overflow-x:auto}
table.dt{width:100%;min-width:600px;table-layout:fixed;font-size:12.5px}
.dt th,.dt td{padding:8px 10px;border:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt th:first-child,.dt td:first-child{padding-left:14px}
.dt th:last-child,.dt td:last-child{padding-right:14px}
.dt th{font-size:10px;letter-spacing:.08em;color:var(--muted);font-weight:600;padding-top:9px;padding-bottom:5px}
.dt td{border-top:1px solid var(--grid)}
.dt td.o,.dt th.o{color:var(--idx);font-variant-numeric:tabular-nums}
.dt td.nm{font-weight:600;white-space:normal}
.dt td.id,.dt td.ph{font:12px Consolas,monospace;color:var(--muted)}
.dt td.rm{white-space:normal;text-overflow:clip}
.dt tbody tr:hover td{background-color:var(--hover)}
.pos{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;padding:1px 7px;border-radius:5px;background:var(--panel2);border:1px solid var(--line2);font-size:11px;font-weight:600}
.rchip{display:inline-block;max-width:100%;box-sizing:border-box;padding:2px 9px;border-radius:5px;border:1px solid var(--line2);background:var(--panel2);font-size:11px;font-weight:600;text-transform:uppercase}
.rchip.lead{color:var(--blue);border-color:rgba(76,141,255,.45);background:rgba(76,141,255,.12)}
.rtxt{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--muted)}
.rtxt.red{color:var(--nred)}
.dim{color:var(--idx)}
.dist-warn{margin-top:18px;color:var(--muted);font-size:11.5px}
@media (max-width:980px){.dist-cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.crew{grid-template-columns:repeat(2,minmax(0,1fr))}.crew>div:nth-child(3){border-left:0}.crew>div:nth-child(n+3){border-top:1px solid var(--line)}.dist-date{font-size:26px}.dist{padding:16px 12px 36px}}
:root[data-theme="dark"] .i-moon,:root:not([data-theme="dark"]) .i-sun{display:none}
@media (max-width:760px){.search{width:120px}.legend{display:none}.month{display:none}.brand small{display:none}}
</style>
</head>
<body>

<div class="top">
  <button class="icon-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 4h14M2 9h14M2 14h14"/></svg>
  </button>
  <div class="brand">Roster Assistant<small id="sub">VAECO</small></div>
  <div class="tabs" id="tabs"></div>
  <div class="spacer"></div>
  <div class="month" id="month">–</div>
  <div class="zoom"><button id="zOut" aria-label="Zoom out">−</button><span id="zVal">100%</span><button id="zIn" aria-label="Zoom in">+</button></div>
  <select class="search" id="team" aria-label="Filter by Đội" hidden></select>
  <input class="search" id="q" type="search" placeholder="Search name or ID" aria-label="Search employees">
  <button class="icon-btn" id="reload" aria-label="Reload roster" title="Reload from Google Sheet">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>
  </button>
  <button class="icon-btn" id="themeBtn" type="button">
    <svg class="i-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="i-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div>

<div class="stats" id="stats"></div>
<div class="note" id="note" hidden></div>
<div class="wrap" id="wrap"><div class="msg" id="msg">Loading roster…</div></div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Menu">
  <header><div class="logo">R</div><div class="brand">Roster Assistant<small>Menu</small></div></header>
  <nav class="nav">
    <button class="on" id="navRoster">Roster</button>
    <button id="navDist">Daily Distribution</button>
    <button id="navKhdt">KHDT → Roster</button>
    <hr>
    <a id="navSheet" href="#" target="_blank" rel="noopener">Open Google Sheet</a>
    <a href="https://github.com/SiniS17/roster-assistant/blob/main/HOW_IT_WORKS.md" target="_blank" rel="noopener">How it works</a>
  </nav>
</aside>

<dialog id="khdt">
  <form class="dlg" id="khdtForm">
    <h2>KHDT → Roster</h2>
    <p>Upload the KHDT training-plan file. Changes are written to the “temp” tab so you can review them — the Main tab is never modified.</p>
    <label for="file">KHDT file (.xlsx)</label>
    <input id="file" name="khdt_file" type="file" accept=".xlsx" required>
    <label for="url">Google Sheet URL to update (needs “Main” and “temp” tabs)</label>
    <input id="url" name="sheet_url" type="text" placeholder="https://docs.google.com/spreadsheets/d/…" required>
    <label class="chk"><input type="checkbox" name="force" id="force"> Overwrite cells that already have content (--force)</label>
    <label class="chk"><input type="checkbox" name="keep" id="keep"> Add to the changes already in temp (otherwise temp restarts from Main)</label>
    <div class="row">
      <button class="btn primary" id="runBtn" type="submit">Run</button>
      <button class="btn" type="button" id="closeDlg">Close</button>
    </div>
    <div id="out"></div>
  </form>
</dialog>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
const WD = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const S = { url:'', gid:'', data:null, zoom:1, updated:new Set(), team:'', view:'roster' };

/* ---------- theme ---------- */
function syncThemeBtn(){
  const dark = document.documentElement.dataset.theme === 'dark';
  $('themeBtn').setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  $('themeBtn').title = dark ? 'Switch to light mode' : 'Switch to dark mode';
}
$('themeBtn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem('theme', next); }catch(e){}
  syncThemeBtn();
};
syncThemeBtn();

/* ---------- zoom / search ---------- */
function setZoom(z){
  S.zoom = Math.min(1.6, Math.max(.6, z));
  document.documentElement.style.setProperty('--z', S.zoom);
  $('zVal').textContent = Math.round(S.zoom*100) + '%';
}
$('zIn').onclick = () => setZoom(S.zoom + .1);
$('zOut').onclick = () => setZoom(S.zoom - .1);
$('q').oninput = () => render();

/* ---------- loading ---------- */
async function load(force){
  $('wrap').innerHTML = '<div class="msg">Loading roster…</div>';
  const p = new URLSearchParams();
  if(S.url) p.set('url', S.url);
  if(S.gid !== '') p.set('gid', S.gid);
  if(force === true) p.set('refresh', '1');
  try{
    const r = await fetch('/api/roster?' + p);
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || 'Unknown error');
    S.data = j; S.gid = j.gid;
    $('navSheet').href = j.sheet_url;
    render();
  }catch(e){
    S.data = null; $('stats').innerHTML = ''; $('tabs').innerHTML = '';
    $('wrap').innerHTML = '<div class="msg"><div><b>Couldn\u2019t load the roster</b>' +
      '<code>' + esc(e.message) + '</code><p>Check that the Sheet is shared with the service account and the Google credentials are set (see HOW_IT_WORKS.md).</p>' +
      '<button class="btn" onclick="load()">Try again</button></div></div>';
  }
}

/* ---------- cells ---------- */
const isRed = c => c && /^FF0000$/i.test(c.slice(-6));
function hue(s){ let h = 0; for(const ch of s) h = (h*31 + ch.charCodeAt(0)) % 360; return h; }
function kindOf(v, color){
  if(!v) return null;
  const u = v.trim().toUpperCase();
  if(u === 'N') return isRed(color) ? 'nred' : 'n';
  if(u.startsWith('H ')) return 'h';
  return 'o';
}

/* ---------- render ---------- */
function render(){
  const d = S.data; if(!d) return;
  if(!d.dates.length){
    $('tabs').innerHTML = ''; $('stats').innerHTML = ''; $('note').hidden = true;
    $('wrap').innerHTML = '<div class="msg"><div><b>No roster days found</b><p>' + (d.notes || []).map(esc).join('<br>') +
      '</p><p>The 1st sheet of each squad needs a header row with ID, NAME and one date per day.</p>' +
      '<button class="btn" onclick="load(true)">Try again</button></div></div>';
    return;
  }
  const dates = d.dates.map(s => { const [y,m,da] = s.split('-').map(Number); return new Date(y, m-1, da); });
  const today = new Date(); today.setHours(0,0,0,0);
  const sameDay = (a,b) => a.getTime() === b.getTime();

  // header: tabs + month
  $('tabs').innerHTML = d.tabs.map(t => `<button class="tab ${t.gid === d.gid ? 'on':''}" data-gid="${t.gid}">${esc(t.title)}${t.title.trim().toLowerCase()==='temp' && d.pending ? `<span class="badge" title="${d.pending} cell(s) differ from Main">${d.pending}</span>` : ''}</button>`).join('');
  // note bar
  const note = $('note'), tempTab = d.tabs.find(t => t.title.trim().toLowerCase()==='temp');
  if(d.view === 'temp'){
    note.hidden = false; note.className = 'note';
    note.innerHTML = d.pending ? `<span>Previewing <b>temp</b>: ${d.pending} cell(s) differ from Main (flickering). Main is unchanged.</span>` : `<span>Previewing <b>temp</b>: identical to Main.</span>`;
  } else if(d.view === 'main' && d.pending && tempTab){
    note.hidden = false; note.className = 'note warn';
    note.innerHTML = `<span><b>temp</b> has ${d.pending} pending change(s) from a KHDT run.</span><button id="seeTemp">Review in temp</button>`;
    $('seeTemp').onclick = () => { S.gid = tempTab.gid; load(); };
  } else if(d.view === 'squads' && (d.notes || []).length){
    note.hidden = false; note.className = 'note warn';
    note.innerHTML = '<span>' + d.notes.map(esc).join(' · ') + '</span>';
  } else note.hidden = true;
  $('tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { S.gid = b.dataset.gid; load(); });
  const first = dates[0], last = dates[dates.length-1];
  $('month').textContent = first.getMonth() === last.getMonth() ? `${MONTHS[first.getMonth()]} ${first.getFullYear()}`
    : `${MON[first.getMonth()]} – ${MON[last.getMonth()]} ${last.getFullYear()}`;

  // filters: Đội + search
  const hi = d.info_headers.findIndex(t => /(^|[^a-z])(doi|squad)($|[^a-z])/.test(fold(t)));
  const teamOf = e => hi >= 0 ? (e.info[hi] || '') : '';
  const tsel = $('team');
  if(hi >= 0){
    const counts = {};
    d.employees.forEach(e => { const t = teamOf(e) || '(blank)'; counts[t] = (counts[t]||0) + 1; });
    if(S.team && !counts[S.team]) S.team = '';
    tsel.innerHTML = `<option value="">${esc(d.info_headers[hi])}: all (${d.employees.length})</option>` +
      Object.keys(counts).sort((a,b) => a.localeCompare(b,'vi')).map(t => `<option value="${esc(t)}" ${t===S.team?'selected':''}>${esc(t)} (${counts[t]})</option>`).join('');
    tsel.hidden = false;
  } else { tsel.hidden = true; S.team = ''; }
  const q = fold($('q').value.trim());
  const rows = d.employees.filter(e =>
    (!S.team || (teamOf(e) || '(blank)') === S.team) &&
    (!q || fold(e.name).includes(q) || fold(e.id).includes(q)));

  // stats + legend (for the rows currently shown)
  let hCount = 0, redN = 0, hToday = 0; const codes = {};
  rows.forEach(e => e.cells.forEach((v,i) => {
    const k = kindOf(v, e.colors[i]); if(!k) return;
    if(k === 'h'){ hCount++; if(sameDay(dates[i], today)) hToday++; }
    if(k === 'nred') redN++;
    if(k === 'o'){ const c = v.trim().toUpperCase(); codes[c] = (codes[c]||0) + 1; }
  }));
  const topCodes = Object.entries(codes).sort((a,b) => b[1]-a[1]).slice(0, 6);
  $('stats').innerHTML =
    `<span><span class="dot" style="background:var(--green)"></span>Headcount <b>${rows.length}</b></span>` +
    `<span><span class="dot" style="background:var(--amber)"></span>Training days (H) <b>${hCount}</b></span>` +
    (dates.some(x => sameDay(x, today)) ? `<span>In training today <b>${hToday}</b></span>` : '') +
    `<span><span class="dot" style="background:var(--red)"></span>Guaranteed days off <b>${redN}</b></span>` +
    `<span class="legend"><span class="lg k-h">H course</span><span class="lg k-nred">N red</span><span class="lg k-n" style="border-color:var(--line2)">N</span>` +
    topCodes.map(([c]) => `<span class="lg k-o" style="--h:${hue(c)}">${esc(c)}</span>`).join('') + `</span>`;

  // table
  const isWe = dt => dt.getDay()===0 || dt.getDay()===6;
  let h = '<table><thead><tr><th class="name">EMPLOYEE</th>';
  dates.forEach(dt => {
    const cls = [isWe(dt) ? 'we':'', sameDay(dt,today) ? 'today':''].join(' ');
    h += `<th class="${cls}"><small>${WD[dt.getDay()]}</small>${dt.getDate()}-${MON[dt.getMonth()]}</th>`;
  });
  h += '</tr></thead><tbody>';
  const chgMap = d.changed || {};
  const ckey = (e, i) => (e.id || e.name) + '|' + d.dates[i];
  const sig = (e, i) => { const k = kindOf(e.cells[i], e.colors[i]); return k ? e.cells[i].trim().toUpperCase() + '|' + k + '|' + (ckey(e,i) in chgMap) : null; };
  rows.forEach((e, n) => {
    const initial = (e.name.trim()[0] || '?').toUpperCase();
    const sub = e.info.filter(Boolean);
    h += `<tr><td class="name"><div class="who"><span class="idx">${n+1}</span><span class="av">${esc(initial)}</span>` +
         `<span><b title="${esc(e.name)}">${esc(e.name)}</b><small><i>${esc(e.id)}</i>${sub.length ? ' · ' + esc(sub.join(' · ')) : ''}</small></span></div></td>`;
    const N = e.cells.length;
    for(let i = 0; i < N; ){
      const v = e.cells[i], k = kindOf(v, e.colors[i]), dt = dates[i];
      if(!k){
        const old = chgMap[ckey(e, i)];
        const ghost = old ? `<span class="chip ghost chg" title="${esc(e.name)} · removed in temp (Main: ${esc(old)})">${esc(/^H /i.test(old.trim()) ? old.trim().slice(2) : old)}</span>` : '';
        h += `<td class="day ${isWe(dt) ? 'we':''} ${sameDay(dt,today) ? 'today':''}">${ghost}</td>`; i++; continue;
      }
      // merge consecutive days that carry the same value into one wide box
      const key = sig(e, i);
      let j = i + 1;
      while(j < N && sig(e, j) === key) j++;
      const chg = ckey(e, i) in chgMap;
      const span = j - i, end = dates[j-1];
      const hasToday = dates.slice(i, j).some(x => sameDay(x, today));
      const up = e.cells.slice(i, j).some((_, x) => S.updated.has(e.row + ':' + d.cols[i+x])) ? ' upd' : '';
      const style = k === 'o' ? ` style="--h:${hue(v.trim().toUpperCase())}"` : '';
      const was = chg && span === 1 ? ` · Main: ${chgMap[ckey(e, i)] || '(empty)'}` : (chg ? ' · changed vs Main' : '');
      const range = span > 1 ? `${dt.getDate()}/${dt.getMonth()+1} – ${end.getDate()}/${end.getMonth()+1} (${span} days)` : `${dt.getDate()}/${dt.getMonth()+1}`;
      const label = k === 'h' ? v.trim().slice(2) : v;
      h += `<td class="day ${span > 1 ? 'span':''} ${span === 1 && isWe(dt) ? 'we':''} ${hasToday ? 'today':''}" colspan="${span}">` +
           `<span class="chip k-${k}${up}${chg ? ' chg':''}"${style} title="${esc(e.name)} · ${range} · ${esc(v)}${esc(was)}">${esc(label)}</span></td>`;
      i = j;
    }
    h += '</tr>';
  });
  h += '</tbody></table>';
  if(!rows.length) h += '<div class="msg">No employee matches the current filter.</div>';
  $('wrap').innerHTML = h;
}

/* ---------- view switch ---------- */

/* ---------- Daily Distribution ---------- */
const DIST = { meta:null, sheet:0, tab:null, days:new Map(), req:0 };
const SHOPS = ['STRUCTURE SHEET METAL','STRUCTURE COMPOSITE','STRUCTURE PAINTING','CABIN'];
const CREW = [['foreman','FOREMAN'],['truc_doi','TRỰC ĐỘI'],['dock_planner','DOCK PLANNER'],['shift_tech','SHIFT / TECH SUPP']];
const MON_UP = MON.map(m => m.toUpperCase());
const pad2 = n => String(n).padStart(2, '0');
const isoDate = iso => { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); };
const todayIso = () => { const t = new Date(); return `${t.getFullYear()}-${pad2(t.getMonth()+1)}-${pad2(t.getDate())}`; };
function fmtHeading(iso){ const d = isoDate(iso); return `${pad2(d.getDate())} ${MON_UP[d.getMonth()]} ${d.getFullYear()}`; }
function fmtRange(a, b){
  if(!a) return '';
  const d1 = isoDate(a), d2 = isoDate(b || a);
  if(d1.getTime() === d2.getTime()) return fmtHeading(a);
  if(d1.getFullYear() !== d2.getFullYear()) return `${fmtHeading(a)} - ${fmtHeading(b)}`;
  if(d1.getMonth() === d2.getMonth()) return `${pad2(d1.getDate())}-${pad2(d2.getDate())} ${MON_UP[d1.getMonth()]} ${d1.getFullYear()}`;
  return `${pad2(d1.getDate())} ${MON_UP[d1.getMonth()]} - ${pad2(d2.getDate())} ${MON_UP[d2.getMonth()]} ${d1.getFullYear()}`;
}
const IC = {
  pin:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  sun:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  tool:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>',
  users:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17.5 14.6c2.3.3 3.7 1.9 4 4.4"/></svg>'
};

async function loadDist(force){
  const my = ++DIST.req;
  $('wrap').innerHTML = '<div class="msg">Loading distribution…</div>';
  $('stats').innerHTML = ''; $('tabs').innerHTML = '';
  try{
    const r = await fetch('/api/distribution' + (force ? '?refresh=1' : ''));
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || 'Unknown error');
    if(my !== DIST.req) return;
    DIST.meta = j.sheets; if(force) DIST.days.clear();
    if(!j.sheets.length){
      $('wrap').innerHTML = '<div class="msg"><div><b>No spreadsheets configured yet</b><p>Add the Google Sheet links to <code>SQUAD_SHEET_URLS</code> in config.py (or set the SQUAD_SHEET_URLS environment variable), share each one with the service account as Viewer, then reload.</p></div></div>';
      return;
    }
    if(!DIST.init){
      DIST.init = true; let saved = NaN; try{ saved = parseInt(localStorage.getItem('distSheet'), 10); }catch(e){}
      DIST.sheet = saved >= 0 && saved < j.sheets.length ? saved : 0;
    } else if(DIST.sheet >= j.sheets.length) DIST.sheet = 0;
    pickDefaultDay();
    renderDist();
  }catch(e){
    if(my !== DIST.req) return;
    $('wrap').innerHTML = '<div class="msg"><div><b>Couldn’t load the distribution</b><code>' + esc(e.message) + '</code>' +
      '<button class="btn" style="margin-top:12px" onclick="loadDist(true)">Try again</button></div></div>';
  }
}

function pickDefaultDay(){
  const sh = DIST.meta[DIST.sheet]; DIST.tab = null;
  if(!sh || !sh.days.length) return;
  const t = isoDate(todayIso()).getTime();
  let best = sh.days[0], bd = Infinity;
  sh.days.forEach(d => { const diff = Math.abs(isoDate(d.date).getTime() - t); if(diff < bd){ bd = diff; best = d; } });
  DIST.tab = best.tab;
}

function renderDist(){
  const sh = DIST.meta[DIST.sheet];
  $('tabs').innerHTML = DIST.meta.map((s, i) =>
    `<button class="tab ${i === DIST.sheet ? 'on' : ''}" data-i="${i}" title="${esc(s.title || '')}">${esc(s.squad)} · ${esc(s.ac)}${s.error ? '<span class="badge" title="Could not read this spreadsheet">!</span>' : ''}</button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => {
    DIST.sheet = +b.dataset.i;
    try{ localStorage.setItem('distSheet', DIST.sheet); }catch(e){}
    pickDefaultDay(); renderDist();
  });
  if(sh && sh.url) $('navSheet').href = sh.url;

  if(sh.error){
    $('stats').innerHTML = '';
    $('wrap').innerHTML = '<div class="msg"><div><b>Couldn’t read ' + esc(sh.ac) + '</b><code>' + esc(sh.error) + '</code>' +
      '<p>Check the link and that the spreadsheet is shared with the service account (Viewer is enough).</p>' +
      '<button class="btn" onclick="loadDist(true)">Try again</button></div></div>';
    return;
  }
  const today = todayIso();
  $('stats').innerHTML = sh.days.length
    ? '<div class="daystrip">' + sh.days.map(d => { const dt = isoDate(d.date);
        return `<button class="dbtn ${d.tab === DIST.tab ? 'on' : ''} ${d.date === today ? 'today' : ''}" data-tab="${esc(d.tab)}" title="${esc(d.tab)}"><small>${WD[dt.getDay()]}${d.date === today ? ' · TODAY' : ''}</small><b>${pad2(dt.getDate())} ${MON_UP[dt.getMonth()]}</b></button>`; }).join('') + '</div>'
    : '<span>No day tabs found in this spreadsheet.</span>';
  $('stats').querySelectorAll('.dbtn').forEach(b => b.onclick = () => { DIST.tab = b.dataset.tab; renderDist(); });
  const active = $('stats').querySelector('.dbtn.on'); if(active) active.scrollIntoView({inline:'center', block:'nearest'});

  if(!DIST.tab){
    $('wrap').innerHTML = '<div class="msg"><div><b>No day tabs</b><p>Name each day’s tab like <code>' + esc(sh.ac) + '-SEP21</code> (A/C, month, day).</p></div></div>';
    return;
  }
  loadDay(sh);
}

async function loadDay(sh, force){
  const my = ++DIST.req, key = DIST.sheet + '|' + DIST.tab;
  if(!force && DIST.days.has(key)){ paintDay(sh, DIST.days.get(key)); return; }
  $('wrap').innerHTML = '<div class="msg">Loading ' + esc(DIST.tab) + '…</div>';
  try{
    const r = await fetch('/api/distribution/day?sheet=' + DIST.sheet + '&tab=' + encodeURIComponent(DIST.tab));
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || 'Unknown error');
    DIST.days.set(key, j);
    if(my === DIST.req) paintDay(sh, j);
  }catch(e){
    if(my !== DIST.req) return;
    $('wrap').innerHTML = '<div class="msg"><div><b>Couldn’t read tab ' + esc(DIST.tab) + '</b><code>' + esc(e.message) + '</code></div></div>';
  }
}

function remarkHtml(p){
  const t = p.remark; if(!t) return '<span class="dim">-</span>';
  if(/leader/i.test(t)) return `<span class="rchip ${/gsgt/i.test(t) ? 'lead' : ''}">${esc(t)}</span>`;
  return `<span class="rtxt ${p.red ? 'red' : ''}">${esc(t)}</span>`;
}
function peopleTable(people){
  return '<div class="tscroll"><table class="dt"><colgroup><col style="width:52px"><col><col style="width:84px"><col style="width:126px"><col style="width:98px"><col></colgroup><tr><th class="o">ORD</th><th>NAME AND SURNAME</th><th>ID</th><th>POS</th><th>PHONE</th><th>REMARK</th></tr>' +
    people.map(p => `<tr><td class="o">${p.ord}</td><td class="nm">${esc(p.name)}</td><td class="id">${esc(p.id)}</td>` +
      `<td>${p.pos ? `<span class="pos" title="${esc(p.pos)}">${esc(p.pos)}</span>` : '<span class="dim">–</span>'}</td>` +
      `<td class="ph">${esc(p.phone) || '<span class="dim">–</span>'}</td><td class="rm">${remarkHtml(p)}</td></tr>`).join('') + '</table></div>';
}

function paintDay(sh, day){
  const zones = day.sections.filter(s => s.kind === 'zone');
  const others = day.sections.filter(s => s.kind !== 'zone');
  const zoneHtml = zones.map(z => {
    const h = z.time ? parseInt(z.time, 10) : null;
    const cls = z.time ? 'shift' : 'zone', ico = z.time ? (h >= 20 || h < 5 ? IC.moon : IC.sun) : IC.pin;
    return `<section class="dcard ${cls}"><header>${ico}<span>${esc(z.title)}</span></header>` +
      (z.people.length ? peopleTable(z.people) : `<div class="empty">No personnel assigned.</div>`) + '</section>';
  }).join('') || '<section class="dcard"><div class="empty">No zones found on this tab.</div></section>';

  const used = new Set();
  const shop = (title, sec) => {
    if(sec) used.add(sec);
    return `<section class="dcard shop"><header>${IC.tool}<span>${esc(title)}</span><span class="tag">${sec && sec.people.length ? sec.people.length + ' ASSIGNED' : 'UNASSIGNED'}</span></header>` +
      (sec && sec.people.length ? peopleTable(sec.people) : `<div class="empty">${IC.users}No personnel assigned for this shift.</div>`) + '</section>';
  };
  let shopHtml = SHOPS.map(t => shop(t, others.find(o => fold(o.title) === fold(t)))).join('');
  shopHtml += others.filter(o => !used.has(o) && o.people.length).map(o => shop(o.title, o)).join('');

  const crew = CREW.map(([k, label]) => { const p = (sh.people || {})[k];
    return `<div><small>${label}</small><b title="${p ? esc(p.name) : ''}">${p ? esc(p.name) : '–'}</b><span>${p && p.phone ? esc(p.phone) : '–'}</span></div>`; }).join('');
  const range = sh.date_from ? fmtRange(sh.date_from, sh.date_to) : (sh.date_text || '–');
  const warn = (sh.warnings || []).length ? `<div class="dist-warn">⚠ ${sh.warnings.map(esc).join(' · ')}</div>` : '';

  $('wrap').innerHTML = `<div class="dist"><div class="dist-head"><div><h1 class="dist-date">${fmtHeading(day.date)}</h1>` +
    `<div class="dist-meta">A/C: <b>${esc(sh.ac || '–')}</b><i>•</i>CHECK: <b>${esc(sh.check || '–')}</b><i>•</i>DATE: <b>${esc(range)}</b></div></div>` +
    `<div class="crew">${crew}</div></div>` +
    `<div class="dist-cols"><div class="dist-col">${zoneHtml}</div><div class="dist-col">${shopHtml}</div></div>${warn}</div>`;
}

/* ---------- KHDT run ---------- */
$('khdtForm').onsubmit = async ev => {
  ev.preventDefault();
  const btn = $('runBtn'), out = $('out');
  btn.disabled = true; btn.textContent = 'Running…'; out.innerHTML = '';
  try{
    const r = await fetch('/run', { method:'POST', body:new FormData($('khdtForm')), headers:{'X-Requested-With':'fetch'} });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || 'Run failed');
    const labels = { marked:'Marked', conflicts:'Conflicts', overlaps_combined:'Overlaps combined', weekend_n:'Weekend N', already_marked:'Already marked', no_id_match:'No ID match', name_mismatch:'Name mismatch', no_date_overlap:'Outside date range' };
    out.innerHTML = '<div class="pills">' + Object.entries(labels).map(([k,t]) => `<span class="pill">${t} <b>${j.stats[k] ?? 0}</b></span>`).join('') + '</div>' +
      '<div class="log">' + esc(j.log.join('\n')) + '</div>' +
      '<div class="row"><button class="btn" type="button" id="dl">Download log (.xlsx)</button><button class="btn primary" type="button" id="see">View changes in temp</button></div>';
    $('dl').onclick = () => {
      const bin = atob(j.log_b64), buf = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
      a.download = 'khdt_roster_log.xlsx'; a.click(); URL.revokeObjectURL(a.href);
    };
    S.updated = new Set();
    S.url = $('url').value.trim();  // review the KHDT changes in that sheet's temp tab
    S.gid = j.gid;
    await load();
    $('see').onclick = () => $('khdt').close();
  }catch(e){
    out.innerHTML = '<div class="err">' + esc(e.message) + '</div>';
  }finally{
    btn.disabled = false; btn.textContent = 'Run';
  }
};

setView(location.hash === '#distribution' ? 'dist' : 'roster');
</script>
</body>
</html>
