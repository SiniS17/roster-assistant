services:
  db:
    image: postgres:16
    container_name: roster-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-roster}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - roster_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roster} -d ${POSTGRES_DB:-roster}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  roster_pgdata:
